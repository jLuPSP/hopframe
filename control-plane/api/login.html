<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hopframe, sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c10;
    --bg-2: #0e1118;
    --panel: #141821;
    --panel-2: #1a1f2a;
    --border: #232936;
    --text: #e6e8ee;
    --text-2: #a8aebd;
    --muted: #6e7689;
    --accent: #5aa8ff;
    --accent-dim: rgba(90, 168, 255, 0.18);
    --red: #f0606b;
    --red-dim: rgba(240, 96, 107, 0.13);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 32px;
    width: 360px;
  }
  .brand { font-size: 14px; font-weight: 600; letter-spacing: 0.4px; margin-bottom: 4px; }
  .brand .h { color: var(--accent); }
  .lead { color: var(--muted); font-size: 11.5px; margin-bottom: 22px; }
  label { display: block; color: var(--text-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; margin-top: 14px; }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 22px;
    width: 100%;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background 120ms;
  }
  button:hover { background: rgba(90, 168, 255, 0.32); }
  .err {
    margin-top: 14px;
    background: var(--red-dim);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 11.5px;
  }
  .footer { color: var(--muted); font-size: 10.5px; margin-top: 22px; text-align: center; }
</style>
</head>
<body>

<form class="card" id="loginForm">
  <div class="brand"><span class="h">HOPFRAME</span></div>
  <div class="lead">Sign in to the operator console.</div>

  <label for="username">username</label>
  <input id="username" name="username" autocomplete="username" autofocus required>

  <label for="password">password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button type="submit">Sign in</button>

  <div class="err" id="err" style="display: none;"></div>

  <div class="footer">v0.1 alpha · BSL 1.1</div>
</form>

<script>
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    err.style.display = "none";
    const body = JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    });
    try {
      const r = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body,
        credentials: "same-origin",
      });
      if (!r.ok) {
        err.textContent = await r.text();
        err.style.display = "block";
        return;
      }
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next") || "/";
      window.location.href = next;
    } catch (e) {
      err.textContent = "network error: " + e.message;
      err.style.display = "block";
    }
  });
</script>
</body>
</html>
