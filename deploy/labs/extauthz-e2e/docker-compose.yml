# Ephemeral end-to-end lab: a REAL Envoy calling Hopframe over the Envoy
# HTTP ext_authz contract, in front of a stub MCP server.
#
#   client --POST MCP--> envoy --ext_authz(HTTP)--> hopframe-authz (mcp-extauthz)
#                          |  (on allow)
#                          +--route--> upstream (stub-mcp-server)
#
# Proves three things (see deploy/labs/extauthz-e2e/README.md):
#   1. benign tools/call            -> allowed, stub answers          (200)
#   2. request-side attack (AWS key)-> denied by ext_authz            (403)
#   3. response-side poison         -> NOT caught here (the blind spot)
#
# Conventions per the project playbook: project name lab-extauthz-e2e,
# isolated network, com.jlu.lab label on everything, host ports in 91xx,
# one-command teardown by label. Nothing here references the local network.
name: lab-extauthz-e2e

networks:
  labnet:
    labels: ["com.jlu.lab=extauthz-e2e"]

services:
  upstream:
    container_name: lab-extauthz-e2e-upstream
    labels: ["com.jlu.lab=extauthz-e2e"]
    build:
      context: ../../..
      dockerfile: deploy/labs/extauthz-e2e/Dockerfile.stub
    # Set to true to serve a poisoned tools/list for the blind-spot demo.
    command: ["--addr", ":8088"]
    networks: [labnet]
    healthcheck:
      # Plain GET (not --spider, which BusyBox sends as a non-GET the
      # /healthz handlers do not match).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8088/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  hopframe-authz:
    container_name: lab-extauthz-e2e-hopframe-authz
    labels: ["com.jlu.lab=extauthz-e2e"]
    build:
      context: ../../..
      dockerfile: deploy/labs/extauthz-e2e/Dockerfile.extauthz
    environment:
      HOPFRAME_CONFIG: /etc/hopframe/extauthz.yaml
      HOPFRAME_EXTAUTHZ_LISTEN_ADDR: ":9180"
      HOPFRAME_EXTAUTHZ_DEST: "upstream"
    volumes:
      - ./extauthz.yaml:/etc/hopframe/extauthz.yaml:ro
      - ../../../content:/etc/hopframe/content:ro
    networks: [labnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9180/healthz"]
      interval: 3s
      timeout: 2s
      retries: 10

  envoy:
    container_name: lab-extauthz-e2e-envoy
    labels: ["com.jlu.lab=extauthz-e2e"]
    image: envoyproxy/envoy:v1.31-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "9101:10000" # MCP ingress (host 9101 -> envoy listener)
      - "9190:9901"  # Envoy admin (stats/clusters), debugging only
    depends_on:
      upstream:
        condition: service_healthy
      hopframe-authz:
        condition: service_healthy
    networks: [labnet]
