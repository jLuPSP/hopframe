name: release

# Real releases fire on `push: tags: ['v*']` (e.g. `git tag v0.1.0 && git push --tags`).
# Manual `workflow_dispatch` is kept for snapshot dry-runs that don't publish anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run goreleaser in --snapshot mode (no publish)"
        required: false
        default: "true"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: install syft
        uses: anchore/sbom-action/download-syft@v0.17.8

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            ${{ inputs.dry_run == 'true' && 'release --clean --snapshot --skip=publish,sign' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload snapshot artifacts
        if: ${{ inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom.json
          retention-days: 7

  # Container image publishing. Uses the multi-stage Dockerfile at
  # repo root (the same one anyone can `docker build .` against).
  # Skipped on dry-run; only fires for real tag pushes.
  docker:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: extract version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: set up qemu
        uses: docker/setup-qemu-action@v3

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.version.outputs.date }}
          tags: |
            ghcr.io/jlupsp/hopframe:${{ steps.version.outputs.version }}
            ghcr.io/jlupsp/hopframe:latest

      - name: cosign sign image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes ghcr.io/jlupsp/hopframe@${DIGEST}

  # Publish the Python SDK to PyPI on real tag pushes, via Trusted Publishing
  # (OIDC) so no PyPI token is stored in the repo. One-time setup: add a trusted
  # publisher on PyPI for project `hopframe` -> this repo / workflow
  # `release.yaml` / environment `pypi`. The package version comes from
  # sdk/python/pyproject.toml, keep it in sync with the tag.
  pypi-sdk:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/hopframe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
