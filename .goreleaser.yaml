# Hopframe release configuration.
#
# Run locally with `goreleaser release --snapshot --clean` to verify a tag
# build without publishing. The release workflow in
# .github/workflows/release.yaml drives the real release on tag push.

version: 2

project_name: hopframe

before:
  hooks:
    - go mod tidy

builds:
  - id: control-plane
    main: ./cmd/control-plane
    binary: control-plane
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: mcp-sensor
    main: ./cmd/mcp-sensor
    binary: mcp-sensor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: mcp-stdio-sensor
    main: ./cmd/mcp-stdio-sensor
    binary: mcp-stdio-sensor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
